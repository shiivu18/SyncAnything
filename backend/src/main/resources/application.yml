spring:
  application:
    name: unlimsync-backend

server:
  port: 8080

  datasource:
    url: jdbc:postgresql://postgres:5432/unlimsync
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Placeholder JWT secret – override via environment variable at runtime
jwt:
  secret: "${JWT_SECRET:default-secret}"
telegram:
  bot-token: "${TELEGRAM_BOT_TOKEN:}"
  chat-id: "${TELEGRAM_CHAT_ID:}"
