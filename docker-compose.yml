version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: unlimsync
      POSTGRES_PASSWORD: password
      POSTGRES_DB: unlimsync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      POSTGRES_USER: unlimsync
      POSTGRES_PASSWORD: password
      POSTGRES_DB: unlimsync
      JWT_SECRET: super-secret-key
    ports:
      - "8080:8080"
    depends_on:
      - db
volumes:
  pgdata:
